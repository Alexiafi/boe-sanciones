services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boe_test
      POSTGRES_PASSWORD: boe_test
      POSTGRES_DB: boe_sanciones_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boe_test -d boe_sanciones_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    command: sh -c "python scripts/migrate.py && pytest -q"
    environment:
      DATABASE_URL: postgresql+asyncpg://boe_test:boe_test@postgres-test:5432/boe_sanciones_test
      DATABASE_URL_SYNC: postgresql://boe_test:boe_test@postgres-test:5432/boe_sanciones_test
      TEST_DATABASE_URL_SYNC: postgresql://boe_test:boe_test@postgres-test:5432/boe_sanciones_test
      PYTHONPATH: /app
      REDIS_URL: redis://unused:6379/0
      OPENAI_API_KEY: ""
      OPENAI_EXTRACTION_ENABLED: "false"
    depends_on:
      postgres-test:
        condition: service_healthy
