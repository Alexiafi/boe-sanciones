services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boe_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-boe_sanciones}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Zero-marginal-cost discovery provider for contact enrichment (session 2
  # research). Set SEARXNG_URL=http://searxng:8080, ENRICHMENT_SEARCH_PROVIDER=searxng
  # and ENRICHMENT_ENABLED=true in .env to use it. Self-hosted only; not exposed
  # beyond localhost:8080.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scripts/migrate.py
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app:celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A app.celery_app:celery beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Local SMTP sandbox: everything the app "sends" lands here instead of a
  # real mailbox. Not started by `docker compose up` — only with
  # `--profile dev-mail` — so a plain startup never risks a real send even if
  # EMAIL_SENDING_ENABLED were mistakenly true. Point SMTP_HOST=mailpit,
  # SMTP_PORT=1025, SMTP_USE_TLS=false at it in .env, then browse
  # http://localhost:8025 to see delivered emails and their PDF attachments.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev-mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
